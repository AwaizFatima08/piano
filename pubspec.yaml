name: rainbow_keys
description: "Rainbow Keys by HomiLabs: a bright, flashing toddler piano with drums, silly sounds, songs and a find-the-key game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^4.1.7
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2A1460"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
